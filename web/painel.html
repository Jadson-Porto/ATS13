<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle ECLSS - Marte</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: #fff; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 8px; max-width: 400px; }
        input, button { margin-top: 10px; width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #d9534f; color: white; border: none; cursor: pointer; font-weight: bold; }
        #mensagem-status { margin-top: 15px; font-weight: bold; color: #5cb85c; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Painel ECLSS - Marte</h2>
        <p>Oxigênio Atual: <span id="nivel-oxigenio">100</span> L</p>
        
        <form id="form-oxigenio" onsubmit="solicitarO2(event)">
            <label for="quantidade">Solicitar Cota Extra (L):</label>
            <input type="number" id="quantidade" name="quantidade" required min="1">
            <button type="submit" id="btn-solicitar">Solicitar Cota</button>
        </form>

        <p id="mensagem-status" style="display:none;"></p>
    </div>

    <script>
        function solicitarO2(event) {
            event.preventDefault();
            const qtd = parseFloat(document.getElementById('quantidade').value);
            const elemO2 = document.getElementById('nivel-oxigenio');
            const elemMsg = document.getElementById('mensagem-status');
            
            setTimeout(() => {
                let atual = parseFloat(elemO2.innerText);
                elemO2.innerText = (atual + qtd).toFixed(1);
                elemMsg.innerText = "Cota solicitada com sucesso!";
                elemMsg.style.display = "block";
            }, 300);
        }
    </script>
</body>
</html>
